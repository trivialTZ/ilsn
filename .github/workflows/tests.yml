name: Scientific tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt
            requirements_notebooks.txt
      - run: python -m pip install -r requirements_dev.txt -r requirements_notebooks.txt
      - run: python -m pytest
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: PYTHONPATH=. python examples/quickstart.py
      - run: PYTHONPATH=. python examples/roman_transfer.py
      - name: Execute tutorial notebooks
        run: >-
          python -m nbconvert --to notebook --execute notebooks/*.ipynb
          --output-dir=outputs/notebooks --ExecutePreprocessor.timeout=180
